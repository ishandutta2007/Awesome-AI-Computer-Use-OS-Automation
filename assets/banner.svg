<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- UI Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes cursorMove {
        0% { transform: translate(180px, 310px); }
        30% { transform: translate(320px, 290px); }
        60% { transform: translate(450px, 340px); }
        100% { transform: translate(180px, 310px); }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .data-stream {
        stroke-dasharray: 6, 6;
        animation: dashAnim 2s linear infinite;
      }
      .animated-cursor {
        animation: cursorMove 9s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad1)" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="220" fill="url(#glowGrad2)" class="pulsing-orb" filter="url(#glow)" />

  <!-- Animated Dynamic Flow Lines (Background) -->
  <path d="M 50 360 C 300 360, 400 330, 600 350 S 900 380, 1150 320" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.3" class="data-stream" />
  <path d="M 80 80 C 350 40, 500 120, 800 60 S 1050 140, 1160 90" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" class="data-stream" />

  <!-- Ambient Dynamic Floating UI Elements (Kept to sides/corners) -->
  <!-- Left Side: Vision Action Card -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="50" y="240" width="210" height="95" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="75" cy="265" r="5" fill="#ef4444" />
    <circle cx="92" cy="265" r="5" fill="#eab308" />
    <circle cx="109" cy="265" r="5" fill="#22c55e" />
    <text x="72" y="295" fill="#38bdf8" class="badge-text" font-size="12">▶ agent.click(x=640, y=480)</text>
    <text x="72" y="318" fill="#94a3b8" class="badge-text" font-size="11">Status: GUI Grounded (OS)</text>
  </g>

  <!-- Right Side: Virtual Sandbox Card -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="940" y="80" width="210" height="100" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <rect x="955" y="98" width="55" height="18" rx="4" fill="#6366f1" fill-opacity="0.3" />
    <text x="962" y="111" fill="#a5b4fc" class="badge-text" font-size="10">VM SANDBOX</text>
    <text x="955" y="142" fill="#f8fafc" class="badge-text" font-size="12">Ubuntu / X11 / Wayland</text>
    <text x="955" y="162" fill="#38bdf8" class="badge-text" font-size="11">● Active VNC Stream</text>
  </g>

  <!-- Interactive Wandering Cursor Indicator -->
  <g class="animated-cursor" opacity="0.75">
    <polygon points="0,0 0,16 5,12 8,19 11,18 8,11 14,11" fill="#38bdf8" stroke="#090d16" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  </g>

  <!-- FOREGROUND: Core Main Banner Content (Guaranteed Unobscured & Crisp) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Top Category Pill -->
    <rect x="-190" y="-85" width="380" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.2" />
    <text x="0" y="-63" fill="#38bdf8" class="badge-text" font-size="13" font-weight="700" letter-spacing="1.2">✦ AUTONOMOUS GUI &amp; OS AGENTS ✦</text>

    <!-- Main Title -->
    <text x="0" y="-10" fill="#ffffff" class="title-text" font-size="44" filter="url(#glow)">Awesome AI Computer Use</text>
    <text x="0" y="38" fill="url(#accentGrad)" class="title-text" font-size="36">&amp; OS Automation Ecosystem</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="86" fill="#cbd5e1" class="subtitle-text" font-size="17">
      Curated Multimodal Vision-Action Agents, Sandboxed Virtual Desktops &amp; Cross-Platform RPA
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(0, 115)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="150" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="75" y="20" fill="#38bdf8" class="badge-text" text-anchor="middle">🖱 GUI Navigation</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-85, 0)">
        <rect x="0" y="0" width="170" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="85" y="20" fill="#818cf8" class="badge-text" text-anchor="middle">🖥 Virtual Desktops</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="155" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="77" y="20" fill="#c084fc" class="badge-text" text-anchor="middle">🌐 Web &amp; Browser-Use</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="300" y="405" width="600" height="2" fill="url(#accentGrad)" opacity="0.8" rx="1" />
</svg>
